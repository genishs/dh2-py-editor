name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: v0.3.0). v 접두어 권장. 이 값이 태그/릴리스 이름이 됩니다.'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'prerelease 로 표시할지 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 빠른 실패: 정식 릴리스(태그 push, 또는 prerelease 가 아닌 수동 실행)인데 README 버전
      # 히스토리에 이 버전 항목이 없으면, 몇 분짜리 빌드를 돌리기 전에 여기서 바로 멈춘다.
      # (release job 의 「Build release notes」 가 같은 스크립트로 본문을 실제로 만든다.)
      # Windows 러너 stdout 은 cp1252 라서 PYTHONUTF8 과 스크립트 내부 재설정으로 한글 출력을 보장한다.
      - name: Check README release notes entry
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          ALLOW_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          PYTHONUTF8: '1'
        run: |
          args=()
          if [ "$ALLOW_MISSING" = "true" ]; then args+=(--allow-missing); fi
          python scripts/release_notes.py --tag "$TAG" --out "$RUNNER_TEMP/release_changes_check.md" \
            --no-compare-link "${args[@]}"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

      # 서명 없는 exe 의 평판 휴리스틱을 조금이라도 덜 불리하게 만들기 위해
      # 버전 리소스(회사/제품/버전) 를 심는다. 상세는 README "다운로드가 막힐 때".
      - name: Generate version resource
        run: python build_version_info.py build/version_info.txt

      - name: Build single-file executable
        run: |
          python -m PyInstaller --onefile --windowed --name koukai2_editor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --version-file build/version_info.txt --noconfirm --clean koukai2_editor.py

      - name: Verify build artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/koukai2_editor.exe")) {
            Write-Error "Build artifact not found"
            exit 1
          }
          $info = (Get-Item "dist/koukai2_editor.exe").VersionInfo
          if (-not $info.ProductName) {
            Write-Error "버전 리소스가 비어 있습니다 (--version-file 누락?)"
            exit 1
          }
          Get-Item "dist/koukai2_editor.exe" | Format-List Name, Length, LastWriteTime
          $info | Format-List CompanyName, ProductName, FileVersion

      # --- 코드 서명 (SignPath Foundation) -------------------------------
      # 저장소 변수 SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      # SIGNPATH_SIGNING_POLICY_SLUG 와 시크릿 SIGNPATH_API_TOKEN 이 설정된
      # 뒤에만 동작한다. 미설정 상태에서는 통째로 건너뛰고 서명 없는 빌드가
      # 그대로 릴리스된다 (기존 동작).
      #
      # 주의: SignPath Foundation 은 릴리스마다 Approver 의 수동 승인을
      # 요구한다. wait-for-completion: true 이므로 승인 전까지 이 잡이
      # 대기한다. 승인을 놓치면 job timeout 으로 실패한다.
      - name: Upload unsigned artifact for signing
        id: upload-unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: koukai2_editor-unsigned
          path: dist/koukai2_editor.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace exe with signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "signed/koukai2_editor.exe")) {
            Write-Error "서명된 산출물이 없습니다."
            exit 1
          }
          $sig = Get-AuthenticodeSignature "signed/koukai2_editor.exe"
          if ($sig.Status -ne 'Valid') {
            Write-Error "서명 검증 실패: $($sig.Status) — $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "서명자: $($sig.SignerCertificate.Subject)"
          Copy-Item signed/koukai2_editor.exe dist/koukai2_editor.exe -Force

      # Chrome Safe Browsing 은 서명 없는 .exe 직접 다운로드에 경고를 띄운다.
      # .zip 으로도 함께 제공해 경고 없이 받을 수 있는 경로를 남긴다.
      # (서명이 붙으면 이 경고 자체가 거의 사라지지만, zip 은 그대로 유지한다.)
      - name: Package zip + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/koukai2_editor.exe release/
          Compress-Archive -Path dist/koukai2_editor.exe -DestinationPath release/koukai2_editor-windows.zip -Force
          Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: koukai2_editor-windows
          path: release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 직전 태그를 찾아 Full Changelog 링크를 만들기 위해 태그 전체 필요

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: koukai2_editor-windows
          path: release

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python (release notes)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 릴리스 본문 = README 버전 히스토리의 해당 버전 항목 (「변경 사항」) + 고정 안내.
      # 이 본문은 winget 매니페스트의 ReleaseNotes 로도 그대로 들어간다 (winget-releaser 가
      # 릴리스 본문을 가져감) — 그래서 짧게 유지하고 상세는 README 링크로 돌린다.
      #
      # 가드: 정식 릴리스(태그 push, 또는 prerelease 가 아닌 수동 실행)인데 README 에
      #   `### vX.Y.Z` 항목이 없으면 이 단계가 실패해 릴리스가 만들어지지 않는다.
      #   prerelease 수동 실행만 항목 없이 진행하고 안내 문구로 대체한다.
      # generate_release_notes(커밋 자동 목록)는 껐다: README 항목과 중복되고, 커밋·PR 제목이
      #   winget ReleaseNotes 에 잡음으로 실리기 때문. 대신 비교 링크(Full Changelog) 한 줄만 남긴다.
      - name: Build release notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.name }}
          ALLOW_MISSING: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          PYTHONUTF8: '1'
        run: |
          args=()
          if [ "$ALLOW_MISSING" = "true" ]; then args+=(--allow-missing); fi
          python scripts/release_notes.py --tag "$TAG" --repo "${{ github.repository }}" \
            --out release_changes.md "${args[@]}"

          cat > release_tail.md <<'EOF'
          ## 설치
          **winget (권장)** — 터미널에서 한 줄. 브라우저 다운로드를 거치지 않아 경고가 없습니다.
          ```
          winget install genishs.Koukai2Editor
          ```
          업데이트는 `winget upgrade genishs.Koukai2Editor`.

          **직접 내려받기** — 아래 `koukai2_editor-windows.zip` 을 받아 아무 폴더에나 압축을 풀면 `koukai2_editor.exe` 가 나옵니다.
          단일 `koukai2_editor.exe` 와 무결성 확인용 `SHA256SUMS.txt` 도 함께 올라와 있습니다.

          ## 사용법
          프로그램을 게임 폴더에 복사할 필요는 없습니다.
          게임 폴더(`KOUKAI2.DAT` 가 있는 곳)에서 실행하면 저장 파일을 자동으로 열고, 다른 곳에서 실행하면 파일 선택 창이 뜹니다.
          (winget 으로 설치했다면 터미널에서 `cd "게임 폴더"` 후 `koukai2-editor`.)
          편집 전 `KOUKAI2.DAT` 와 `MAIN.EXE` 를 백업하고, 게임은 끈 상태에서 편집하세요.

          ## 다운로드 경고·코드 서명
          `.exe` 에는 코드 서명이 없어 Chrome·SmartScreen 이 경고할 수 있습니다. 바이러스가 아니라 서명 평판이 없다는 뜻이며,
          winget 설치나 `.zip` 은 보통 경고 없이 받아집니다. 대처법은 [README](https://github.com/${{ github.repository }}/blob/master/README.md#다운로드가-막힐-때) 참조.

          SignPath Foundation 무료 코드 서명은 신청했으나 프로젝트 가시성 요건 미달로 보류되었고, 재신청할 예정입니다
          ([`CODE_SIGNING_POLICY.md`](https://github.com/${{ github.repository }}/blob/master/CODE_SIGNING_POLICY.md)).
          모든 바이너리는 공개 저장소의 소스에서 GitHub Actions 로 자동 빌드됩니다.
          EOF

          cat release_changes.md release_tail.md > release_body.md
          echo "----- release_body.md -----"
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            release/koukai2_editor-windows.zip
            release/koukai2_editor.exe
            release/SHA256SUMS.txt
          body_path: release_body.md
          generate_release_notes: false

  # --- winget 자동 제출 (microsoft/winget-pkgs) ---------------------------
  # 릴리스가 만들어진 뒤 winget 커뮤니티 저장소에 새 버전 매니페스트 PR 을 올린다.
  #
  # 왜 별도 워크플로(on: release)가 아니라 같은 파일의 후속 job 인가:
  #   GITHUB_TOKEN 으로 만든 릴리스는 다른 워크플로를 깨우지 않는다
  #   (GitHub 문서: GITHUB_TOKEN 이벤트는 새 워크플로 실행을 만들지 않음).
  #   그래서 release job 뒤에 needs: 로 잇는다.
  #
  # 시크릿 WINGET_TOKEN (classic PAT: public_repo + workflow) 이 없거나 비면
  # 이 job 의 실제 단계는 전부 건너뛰고 notice 한 줄만 남긴다 — 실패가 아니다.
  # (secrets 는 job-level `if` 에서 못 읽으므로 job-level env 로 불리언을 만들어
  #  step-level `if` 로 거른다.)
  #
  # 전제: winget-pkgs 에 이 패키지의 버전이 이미 하나 이상 있어야 한다
  #       (액션이 최신 버전 매니페스트를 바탕으로 새 버전을 만든다 — 설명·태그·ko-KR 로캘 등 승계).
  winget:
    name: Submit to winget-pkgs
    needs: release
    runs-on: ubuntu-latest
    # prerelease 는 winget 에 올리지 않는다.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
    permissions:
      contents: read
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skip notice (WINGET_TOKEN not set)
        if: ${{ env.HAS_WINGET_TOKEN != 'true' }}
        shell: bash
        run: |
          echo "::notice title=winget 제출 건너뜀::시크릿 WINGET_TOKEN 이 없거나 비어 있어 winget-pkgs 제출을 건너뜁니다 (실패 아님)."

      - name: Determine release tag and version
        id: ver
        if: ${{ env.HAS_WINGET_TOKEN == 'true' }}
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_VERSION"
          else
            tag="${{ github.ref_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "winget 제출 대상: tag=$tag version=${tag#v}"

      # 액션은 v2 태그/main 이 같은 커밋을 가리키는 동안 그 SHA 로 고정한다
      # (PAT 를 넘기는 액션이라 가변 ref 를 쓰지 않는다). 갱신은 수동 또는 dependabot.
      - name: Publish to winget-pkgs
        if: ${{ env.HAS_WINGET_TOKEN == 'true' }}
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2 (main 2026-10-07)
        with:
          identifier: genishs.Koukai2Editor
          # 릴리스 에셋 중 koukai2_editor.exe 만 (zip·SHA256SUMS.txt 제외)
          installers-regex: 'koukai2_editor\.exe$'
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ steps.ver.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
