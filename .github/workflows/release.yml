name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: v0.3.0). v 접두어 권장. 이 값이 태그/릴리스 이름이 됩니다.'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'prerelease 로 표시할지 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

      # 서명 없는 exe 의 평판 휴리스틱을 조금이라도 덜 불리하게 만들기 위해
      # 버전 리소스(회사/제품/버전) 를 심는다. 상세는 README "다운로드가 막힐 때".
      - name: Generate version resource
        run: python build_version_info.py build/version_info.txt

      - name: Build single-file executable
        run: |
          python -m PyInstaller --onefile --windowed --name koukai2_editor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --version-file build/version_info.txt --noconfirm --clean koukai2_editor.py

      - name: Verify build artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/koukai2_editor.exe")) {
            Write-Error "Build artifact not found"
            exit 1
          }
          $info = (Get-Item "dist/koukai2_editor.exe").VersionInfo
          if (-not $info.ProductName) {
            Write-Error "버전 리소스가 비어 있습니다 (--version-file 누락?)"
            exit 1
          }
          Get-Item "dist/koukai2_editor.exe" | Format-List Name, Length, LastWriteTime
          $info | Format-List CompanyName, ProductName, FileVersion

      # --- 코드 서명 (SignPath Foundation) -------------------------------
      # 저장소 변수 SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
      # SIGNPATH_SIGNING_POLICY_SLUG 와 시크릿 SIGNPATH_API_TOKEN 이 설정된
      # 뒤에만 동작한다. 미설정 상태에서는 통째로 건너뛰고 서명 없는 빌드가
      # 그대로 릴리스된다 (기존 동작).
      #
      # 주의: SignPath Foundation 은 릴리스마다 Approver 의 수동 승인을
      # 요구한다. wait-for-completion: true 이므로 승인 전까지 이 잡이
      # 대기한다. 승인을 놓치면 job timeout 으로 실패한다.
      - name: Upload unsigned artifact for signing
        id: upload-unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: koukai2_editor-unsigned
          path: dist/koukai2_editor.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace exe with signed build
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          if (-not (Test-Path "signed/koukai2_editor.exe")) {
            Write-Error "서명된 산출물이 없습니다."
            exit 1
          }
          $sig = Get-AuthenticodeSignature "signed/koukai2_editor.exe"
          if ($sig.Status -ne 'Valid') {
            Write-Error "서명 검증 실패: $($sig.Status) — $($sig.StatusMessage)"
            exit 1
          }
          Write-Host "서명자: $($sig.SignerCertificate.Subject)"
          Copy-Item signed/koukai2_editor.exe dist/koukai2_editor.exe -Force

      # Chrome Safe Browsing 은 서명 없는 .exe 직접 다운로드에 경고를 띄운다.
      # .zip 으로도 함께 제공해 경고 없이 받을 수 있는 경로를 남긴다.
      # (서명이 붙으면 이 경고 자체가 거의 사라지지만, zip 은 그대로 유지한다.)
      - name: Package zip + checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/koukai2_editor.exe release/
          Compress-Archive -Path dist/koukai2_editor.exe -DestinationPath release/koukai2_editor-windows.zip -Force
          Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: koukai2_editor-windows
          path: release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: koukai2_editor-windows
          path: release

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            release/koukai2_editor-windows.zip
            release/koukai2_editor.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            대항해시대 II 세이브 에디터 (Python 재구현) ${{ steps.tag.outputs.name }}

            ## 내려받기
            - **`koukai2_editor-windows.zip`** ← 이걸 받으세요. 압축을 풀면 `koukai2_editor.exe` 가 나옵니다.
            - `koukai2_editor.exe` — 단일 파일. 브라우저가 경고를 띄울 수 있습니다 (아래 참고).
            - `SHA256SUMS.txt` — 무결성 확인용 체크섬.

            ## 브라우저가 다운로드를 막는다면
            이 프로그램은 **아직 코드 서명 인증서가 없습니다.**
            그래서 Chrome 은 "일반적으로 다운로드되지 않는 파일" 이라는 경고를 띄웁니다. 바이러스가
            발견된 것이 아니라, **서명이 없어 평판 데이터가 없다** 는 뜻입니다.

            - **가장 쉬운 방법**: 위의 `.zip` 을 받으세요. 보통 경고 없이 받아집니다.
            - `.exe` 를 직접 받다 막혔다면: Chrome 다운로드 항목의 **⋮ → 계속** (또는 "무시하고 계속").
            - 실행할 때 파란 SmartScreen 창이 뜨면 **추가 정보 → 실행**.
            - 걱정되면 `SHA256SUMS.txt` 의 해시와 대조하거나, 소스를 직접 빌드하세요 (`build.bat`).

            ## 코드 서명 (Code signing)
            이 프로젝트는 [SignPath Foundation](https://signpath.org/) 의 오픈소스 무료 코드 서명
            프로그램에 **신청 중**입니다. 승인되면 릴리스 바이너리는 SignPath Foundation 이 발급한
            인증서로 서명되며, 서명 인프라는 [SignPath.io](https://signpath.io/) 가 무료로 제공합니다.

            - Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/) — *pending approval*.
            - 역할 구분·빌드/서명 절차·개인정보 처리: [`CODE_SIGNING_POLICY.md`](https://github.com/${{ github.repository }}/blob/master/CODE_SIGNING_POLICY.md)

            모든 배포 바이너리는 공개 저장소의 소스에서 GitHub Actions 로 자동 빌드됩니다.

            ## 사용법
            1. `koukai2_editor.exe` 를 게임 폴더 (KOUKAI2.DAT 가 있는 곳) 에 복사
            2. 더블클릭 또는 cmd / PowerShell 에서 실행
            3. 메뉴에 따라 슬롯을 선택하고 편집

            ## 백업 권장
            편집 전 `KOUKAI2.DAT` 와 `MAIN.EXE` 를 백업하세요.

            상세는 [README.md](https://github.com/${{ github.repository }}/blob/master/README.md) 참조.
