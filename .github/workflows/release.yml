name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: v0.3.0). v 접두어 권장. 이 값이 태그/릴리스 이름이 됩니다.'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'prerelease 로 표시할지 여부'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller

      - name: Build single-file executable
        run: |
          python -m PyInstaller --onefile --console --name koukai2_editor --noconfirm --clean koukai2_editor.py

      - name: Verify build artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/koukai2_editor.exe")) {
            Write-Error "Build artifact not found"
            exit 1
          }
          Get-Item "dist/koukai2_editor.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: koukai2_editor-windows
          path: dist/koukai2_editor.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: koukai2_editor-windows
          path: dist

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: dist/koukai2_editor.exe
          generate_release_notes: true
          body: |
            대항해시대 II 세이브 에디터 (Python 재구현) ${{ steps.tag.outputs.name }}

            ## 사용법
            1. `koukai2_editor.exe` 를 게임 폴더 (KOUKAI2.DAT 가 있는 곳) 에 복사
            2. 더블클릭 또는 cmd / PowerShell 에서 실행
            3. 메뉴에 따라 슬롯을 선택하고 편집

            ## 백업 권장
            편집 전 `KOUKAI2.DAT` 와 `MAIN.EXE` 를 백업하세요.

            상세는 [README.md](https://github.com/${{ github.repository }}/blob/master/README.md) 참조.
